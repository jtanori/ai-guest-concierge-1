name: CI

on:
  pull_request:
  push:
    branches: [main]

# W00-12 — "A PR produces a preview URL and a green check."
# lint/typecheck/test run immediately. preview deploys the PR to the linked
# Vercel project (repo secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID)
# and probes the deployed endpoint — the proof is a green check AND a
# reachable URL printed in the log. The deployed surface is the CI probe in
# api/health.ts (vercel.json pins @vercel/node on api/** — the zero-config
# root-entrypoint pipeline dead-ends on our noEmit tsconfig) until S01 ships
# real routes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # W00-13 — the environment gate, on every PR. The charter's DoD is "CI
  # `check:env` step green", and a gate that is only exercised by hand is a gate
  # nobody has run since the day it was written. Three invocations, deliberately:
  #
  #   1. the gate REJECTS a shared staging/prod database (the failure the AC is
  #      about) — asserted by expecting a non-zero exit,
  #   2. the gate ACCEPTS three separate databases,
  #   3. when the repository actually has the two URLs as secrets, the real matrix
  #      runs too. Absent secrets, step 3 is skipped and says so; it is never
  #      silently green.
  #
  # Placeholder URLs are used for 1 and 2 and never printed: `check:env` masks what
  # it reports.
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The gate reads one file per environment, the same files the deploy and
      # `secrets:sync` read. These are synthetic, written in the runner.
      - name: the gate rejects a shared staging/prod database
        run: |
          mkdir -p /tmp/fixtures
          printf 'APP_ENV=staging\nDATABASE_URL=postgres://u:p@shared.example.com/concierge\n' > /tmp/fixtures/.env.staging
          printf 'APP_ENV=prod\nDATABASE_URL=postgres://u:p@shared.example.com/concierge\n' > /tmp/fixtures/.env.prod
          set +e
          npm run check:env -- --staging /tmp/fixtures/.env.staging --prod /tmp/fixtures/.env.prod
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:env ACCEPTED a shared staging/prod database; the W00-13 gate is not working"
            exit 1
          fi
          echo "gate refused the shared database as expected (exit $code)"

      - name: the gate accepts three separate databases
        run: |
          printf 'APP_ENV=staging\nDATABASE_URL=postgres://u:p@staging.example.com/concierge\n' > /tmp/fixtures/.env.staging
          printf 'APP_ENV=prod\nDATABASE_URL=postgres://u:p@prod.example.com/concierge\n' > /tmp/fixtures/.env.prod
          printf 'APP_ENV=local\nDATABASE_URL=postgres://concierge:concierge@localhost:54329/concierge_local\n' > /tmp/fixtures/.env.local
          npm run check:env -- --staging /tmp/fixtures/.env.staging --prod /tmp/fixtures/.env.prod --local /tmp/fixtures/.env.local

      - name: the gate rejects staging reusing the local database
        run: |
          printf 'APP_ENV=staging\nDATABASE_URL=postgres://concierge:concierge@localhost:54329/concierge_local\n' > /tmp/fixtures/.env.staging
          set +e
          npm run check:env -- --staging /tmp/fixtures/.env.staging --prod /tmp/fixtures/.env.prod --local /tmp/fixtures/.env.local
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:env accepted a deployed environment pointing at the local database"
            exit 1
          fi
          echo "gate refused local reuse as expected (exit $code)"

      - name: the gate refuses a mislabelled file
        run: |
          # A .env.staging containing APP_ENV=prod would compare production to
          # production and call the result "separate". That false pass is refused.
          printf 'APP_ENV=prod\nDATABASE_URL=postgres://u:p@staging.example.com/concierge\n' > /tmp/fixtures/.env.mislabelled
          set +e
          npm run check:env -- --staging /tmp/fixtures/.env.mislabelled --prod /tmp/fixtures/.env.prod
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:env compared a file that declares APP_ENV=prod while labelled --staging"
            exit 1
          fi

      - name: readiness rejects a half-filled staging file
        run: |
          mkdir -p /tmp/ready
          # A file that is complete except for LLM_API_KEY: the contract must catch it.
          cat > /tmp/ready/.env.incomplete <<'ENVEOF'
          APP_ENV=staging
          DATABASE_URL=postgres://u:p@staging.example.com/concierge
          NEON_AUTH_ISSUER=https://staging.neonauth.example.com/auth
          NEON_AUTH_JWKS_URL=https://staging.neonauth.example.com/auth/.well-known/jwks.json
          GUEST_COOKIE_SECRET=0123456789abcdef0123456789abcdef
          GUEST_PUBLIC_URL=https://staging.chat.example.com
          LLM_PRIMARY_MODEL=gemini-2.5-flash
          LLM_FALLBACK_MODEL=gemini-2.5-flash-lite
          EMBEDDING_API_KEY=sk-not-a-real-key-0123456789
          TURNSTILE_SECRET=0x4AAAAAAAnotarealsecret
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAAsitekey
          EMAIL_FROM=Concierge <desk@example.com>
          EMAIL_API_KEY=re_notarealkey0123456789
          EMAIL_ESCALATION_FALLBACK=oncall@example.com
          CONSOLE_BASE_URL=https://console.staging.example.com
          REVIEW_API_URL=https://api.staging.example.com
          ENVEOF
          set +e
          npm run check:readiness -- --env staging --file /tmp/ready/.env.incomplete
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:readiness passed a staging file with no LLM_API_KEY"
            exit 1
          fi
          echo "readiness refused the incomplete file as expected (exit $code)"

      - name: readiness accepts the same file once complete
        run: |
          printf 'LLM_API_KEY=AIza-not-a-real-key-0123456789\n' >> /tmp/ready/.env.incomplete
          npm run check:readiness -- --env staging --file /tmp/ready/.env.incomplete

      # The real matrix is NOT run here on purpose. A CI job cannot read two GitHub
      # Environments' secrets — that is the isolation the design depends on — so a
      # step here could only ever compare two empty strings and pass. The operator
      # runs it with the real files before a deploy:
      #   npm run check:env -- --staging .env.staging --prod .env.production --local .env
      # and the deploy job proves separation on live hosts via the cluster fingerprint
      # in `npm run smoke`.

  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          POSTGRES_DB: concierge_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U concierge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://concierge:concierge@localhost:54329/concierge_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:test

  # S04-01 — the staff screen (web/) is its own npm project, so a plain
  # `npm ci` at the root never touches it and a broken screen would merge
  # green. It has its own lockfile; build it in isolation.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  # Vercel preview — the AC closes here: every PR gets a unique deployment
  # URL (not an alias) from the linked jtanori project, then /api/health.ts is
  # probed over HTTPS; the job fails unless the probe is HTTP 200.
  # Fork PRs are skipped: the pull_request token carries no repo secrets
  # (GitHub withholds VERCEL_TOKEN), so a fork run could never deploy — that
  # limitation is documented in the W00-12 runbook note. `preview` is
  # deliberately NOT in branch protection's required contexts so a skipped
  # fork preview cannot dead-end a merge; it remains the welcome gate for
  # internal PRs.
  preview:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deploy PR preview to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx -y vercel@latest deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW URL: $URL"
      - name: Probe preview /api/health.ts
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health.ts")"
          echo "preview /api/health.ts -> HTTP $CODE"
          test "$CODE" = "200"
