name: CI

on:
  pull_request:
  push:
    branches: [main]

# W00-12 — "A PR produces a preview URL and a green check."
# lint/typecheck/test run immediately. preview deploys the PR to the linked
# Vercel project (repo secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID)
# and probes the deployed endpoint — the proof is a green check AND a
# reachable URL printed in the log. The deployed surface is the CI probe in
# api/health.ts (vercel.json pins @vercel/node on api/** — the zero-config
# root-entrypoint pipeline dead-ends on our noEmit tsconfig) until S01 ships
# real routes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # W00-13 — the environment gate, on every PR. The charter's DoD is "CI
  # `check:env` step green", and a gate that is only exercised by hand is a gate
  # nobody has run since the day it was written. Three invocations, deliberately:
  #
  #   1. the gate REJECTS a shared staging/prod database (the failure the AC is
  #      about) — asserted by expecting a non-zero exit,
  #   2. the gate ACCEPTS three separate databases,
  #   3. when the repository actually has the two URLs as secrets, the real matrix
  #      runs too. Absent secrets, step 3 is skipped and says so; it is never
  #      silently green.
  #
  # Placeholder URLs are used for 1 and 2 and never printed: `check:env` masks what
  # it reports.
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: the gate rejects a shared staging/prod database
        run: |
          set +e
          STAGING_DATABASE_URL="postgres://u:p@shared.example.com/concierge" \
          PROD_DATABASE_URL="postgres://u:p@shared.example.com/concierge" \
            npm run check:env
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:env ACCEPTED a shared staging/prod database; the W00-13 gate is not working"
            exit 1
          fi
          echo "gate refused the shared database as expected (exit $code)"

      - name: the gate accepts three separate databases
        run: |
          LOCAL_DATABASE_URL="postgres://concierge:concierge@localhost:54329/concierge_local" \
          STAGING_DATABASE_URL="postgres://u:p@staging.example.com/concierge" \
          PROD_DATABASE_URL="postgres://u:p@prod.example.com/concierge" \
            npm run check:env

      - name: the gate rejects staging reusing the local database
        run: |
          set +e
          LOCAL_DATABASE_URL="postgres://concierge:concierge@localhost:54329/concierge_local" \
          STAGING_DATABASE_URL="postgres://concierge:concierge@localhost:54329/concierge_local" \
          PROD_DATABASE_URL="postgres://u:p@prod.example.com/concierge" \
            npm run check:env
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:env accepted a deployed environment pointing at the local database"
            exit 1
          fi

      # `secrets` is NOT available in an `if:` expression — GitHub rejects the whole
      # workflow file at parse time, which is a 0-second "failure" with no jobs and
      # no logs. Availability is decided in the shell instead, where the masked value
      # is readable and a missing secret produces a visible warning rather than a
      # silently skipped step.
      - name: the real deployment matrix (needs both URLs as secrets)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${STAGING_DATABASE_URL}" ] || [ -z "${PROD_DATABASE_URL}" ]; then
            echo "::warning::STAGING_DATABASE_URL / PROD_DATABASE_URL are not set — the real matrix was SKIPPED, which is not a pass."
            exit 0
          fi
          npm run check:env

      - name: readiness contract for a complete staging file
        run: |
          cat > /tmp/env.staging.ci <<'ENVFILE'
          APP_ENV=staging
          DATABASE_URL=postgres://u:p@staging.example.com/concierge
          NEON_AUTH_ISSUER=https://staging.neonauth.example.com/concierge/auth
          NEON_AUTH_JWKS_URL=https://staging.neonauth.example.com/concierge/auth/.well-known/jwks.json
          GUEST_COOKIE_SECRET=ci-fixture-not-a-real-secret-0123456789
          GUEST_PUBLIC_URL=https://staging.chat.example.com
          LLM_PRIMARY_MODEL=gemini-2.5-flash
          LLM_FALLBACK_MODEL=gemini-2.5-flash-lite
          LLM_API_KEY=ci-fixture-key-0123456789
          EMBEDDING_API_KEY=ci-fixture-embedding-key-0123456789
          TURNSTILE_SECRET=ci-fixture-turnstile-0123456789
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=ci-fixture-site-key
          EMAIL_FROM=Concierge <desk@example.com>
          EMAIL_API_KEY=ci-fixture-email-key-0123456789
          EMAIL_ESCALATION_FALLBACK=oncall@example.com
          CONSOLE_BASE_URL=https://console.staging.example.com
          REVIEW_API_URL=https://api.staging.example.com
          ENVFILE
          npm run check:readiness -- --env staging --file /tmp/env.staging.ci

      - name: readiness refuses an incomplete staging file
        run: |
          printf 'APP_ENV=staging\nDATABASE_URL=postgres://u:p@h/d\n' > /tmp/env.staging.broken
          set +e
          npm run check:readiness -- --env staging --file /tmp/env.staging.broken
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::check:readiness passed a staging file with no guest cookie secret and no models"
            exit 1
          fi

  # S01-01/02/03 — schema + RLS + isolation suite. `npm test` deliberately
  # excludes tests/db (its own config, long hooks, single worker); this job
  # provides the database and runs `npm run db:test`, which fails the build
  # on any RLS leak (S01-03 AC).
  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          POSTGRES_DB: concierge_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U concierge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://concierge:concierge@localhost:54329/concierge_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:test

  # S04-01 — the staff screen (web/) is its own npm project, so a plain
  # `npm ci` at the root never touches it and a broken screen would merge
  # green. It has its own lockfile; build it in isolation.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  # Vercel preview — the AC closes here: every PR gets a unique deployment
  # URL (not an alias) from the linked jtanori project, then /api/health.ts is
  # probed over HTTPS; the job fails unless the probe is HTTP 200.
  # Fork PRs are skipped: the pull_request token carries no repo secrets
  # (GitHub withholds VERCEL_TOKEN), so a fork run could never deploy — that
  # limitation is documented in the W00-12 runbook note. `preview` is
  # deliberately NOT in branch protection's required contexts so a skipped
  # fork preview cannot dead-end a merge; it remains the welcome gate for
  # internal PRs.
  preview:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deploy PR preview to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx -y vercel@latest deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW URL: $URL"
      - name: Probe preview /api/health.ts
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health.ts")"
          echo "preview /api/health.ts -> HTTP $CODE"
          test "$CODE" = "200"
