name: CI

on:
  pull_request:
  push:
    branches: [main]

# W00-12 — "A PR produces a preview URL and a green check."
# The lint/typecheck/test checks run immediately. The `preview` job is the
# PR preview phase: it is wired as a no-op until the Phase B hosting
# account exists, then replaced with the Vercel deploy action so the job
# emits the preview URL. Kept in the tree now so branch protection (W00-11)
# can require the head context from day one.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Placeholder — implementation is a Phase B step (needs a Vercel account).
  # Replace the echo with amondnet/vercel-action (or vercel CLI) and surface
  # the returned URL; the AC is only marked Done once a real PR shows both a
  # green check and a reachable preview URL.
  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: preview (stub until hosting account exists)
        run: |
          echo "PREVIEW STUB: configure Vercel in Phase B (ai-guest-concierge docs/runbook.md → W00-12)"
