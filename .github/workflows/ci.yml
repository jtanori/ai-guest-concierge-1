name: CI

on:
  pull_request:
  push:
    branches: [main]

# W00-12 — "A PR produces a preview URL and a green check."
# lint/typecheck/test run immediately. preview deploys the PR to the linked
# Vercel project (repo secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID)
# and probes the deployed endpoint — the proof is a green check AND a
# reachable URL printed in the log. The deployed surface is the CI probe in
# api/health.ts (vercel.json pins @vercel/node on api/** — the zero-config
# root-entrypoint pipeline dead-ends on our noEmit tsconfig) until S01 ships
# real routes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Vercel preview — the AC closes here: every PR gets a unique deployment
  # URL (not an alias) from the linked jtanori project, then /api/health.ts is
  # probed over HTTPS; the job fails unless the probe is HTTP 200.
  # Fork PRs are skipped: the pull_request token carries no repo secrets
  # (GitHub withholds VERCEL_TOKEN), so a fork run could never deploy — that
  # limitation is documented in the W00-12 runbook note. `preview` is
  # deliberately NOT in branch protection's required contexts so a skipped
  # fork preview cannot dead-end a merge; it remains the welcome gate for
  # internal PRs.
  preview:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deploy PR preview to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx -y vercel@latest deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW URL: $URL"
      - name: Probe preview /api/health.ts
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health.ts")"
          echo "preview /api/health.ts -> HTTP $CODE"
          test "$CODE" = "200"
