name: eval

# S06-03 — G2 on every change that can move it.
#
# Two jobs, deliberately not the same job:
#
#  - `eval` runs on PRs that touch the model path, the retrieval path, the
#    harness itself, or the golden set. It uses the deterministic grounded
#    provider: no key, no network, no cost, and a red check always means
#    something the author can fix in this PR.
#  - `canary` runs nightly (and on demand) against the real Gemini pair. It is
#    the only place a live model is measured, and it is the only place a key
#    exists. A vendor outage can make the canary red; that must never be able to
#    block a pull request, which is why it is a separate workflow trigger rather
#    than a `continue-on-error` step inside the PR job.
on:
  pull_request:
    paths:
      - "src/ai/**"
      - "src/knowledge/**"
      - "src/eval/**"
      - "src/golden/**"
      - "data/golden/**"
      - "scripts/eval.ts"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          POSTGRES_DB: concierge_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U concierge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://concierge:concierge@localhost:54329/concierge_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The demo tenant is the fixture property: the golden set is scored
      # against the articles and facts it actually has, which is the whole point
      # of the retrieval diagnostic in the report.
      - run: npm run db:migrate
      - run: npm run db:seed
      # S06A-01: "which commit and which golden file produced this artifact"
      # must not depend on the eval step having succeeded, so it is written
      # first and kept with `if: always()`. Digests and ids only — never a
      # secret, a DSN or a credential of any kind.
      - name: Record run provenance
        if: always()
        run: |
          printf 'commit: %s\nref: %s\nrun: %s\nevent: %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > run-provenance.txt
          # The path is the evaluator's default; `scripts/eval.ts` prints the
          # digest of whichever file it actually scored, and that line is the
          # one to trust when --golden is overridden.
          sha256sum data/golden/golden-questions-v1.csv > golden.sha256
      - name: G2 evaluation (deterministic provider)
        # pipefail: without it `tee` would swallow the gate's non-zero exit and
        # the job would be green on a failing evaluation.
        run: |
          set -o pipefail
          npm run eval | tee eval-report.md
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.md
            run-provenance.txt
            golden.sha256
          if-no-files-found: ignore

  canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # W00-13: the canary measures the SAME pair the app boots with, so it reads
    # staging's own contract values — one credential, one name (LLM_API_KEY),
    # rotated in one place. Binding the environment is what resolves
    # `secrets.LLM_API_KEY` to staging's value. Tradeoff: if staging later gets
    # required reviewers, the nightly run queues for approval.
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          POSTGRES_DB: concierge_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U concierge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://concierge:concierge@localhost:54329/concierge_local
      # The staging environment is bound above, so these resolve to staging's own
      # contract values — the SAME secret and model ids the deployed API boots
      # with (`buildAi` → `loadLlmConfig` reads exactly these three names). The
      # old GEMINI_API_KEY read a name nothing consumed; the gate checked it,
      # `loadLlmConfig` never did, and the run died one step later on the missing
      # model ids anyway. One name per credential, never echoed: the script
      # reports scores, and the provider adapter's errors are already redacted.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Record run provenance
        # Same as the PR job: the artifact has to say which commit and which
        # golden file it measured even when the live run fails partway.
        if: always()
        run: |
          printf 'commit: %s\nref: %s\nrun: %s\nevent: %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > run-provenance.txt
          sha256sum data/golden/golden-questions-v1.csv > golden.sha256
      - name: G2 evaluation (live model)
        run: |
          set -o pipefail
          npm run eval -- --live | tee canary-report.md
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: |
            canary-report.md
            run-provenance.txt
            golden.sha256
          if-no-files-found: ignore
